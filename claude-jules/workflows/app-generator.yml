name: App Generator Workflow
description: Generate a complete application from requirements
version: 1.0.0

triggers:
  - command: "generate app"
  - command: "create application"
  - command: "build app"

parameters:
  - name: "appType"
    description: "Type of application (web, mobile, cli, api)"
    required: true
    default: "web"
  
  - name: "framework"
    description: "Framework to use (react, next, express, etc.)"
    required: false
    default: "auto"
    
  - name: "features"
    description: "Comma-separated list of features to include"
    required: true

steps:
  - name: "Plan Architecture"
    type: "analyze"
    description: "Plan application architecture and structure"
    prompt: "Plan the architecture for a {appType} application with features: {features}. Define the folder structure, technology stack, and component hierarchy."
    timeout: 60

  - name: "Setup Project"
    type: "generate"
    description: "Generate project setup files"
    prompt: "Generate the project setup files including package.json, configuration files, and directory structure for the planned architecture."
    timeout: 45

  - name: "Generate Core Components"
    type: "generate"
    description: "Generate core application components"
    prompt: "Generate the core components, modules, and files needed for the main functionality of the application."
    timeout: 90

  - name: "Implement Features"
    type: "generate"
    description: "Implement requested features"
    prompt: "Implement the specific features requested: {features}. Create all necessary components, services, and logic."
    timeout: 120

  - name: "Setup Routing"
    type: "generate"
    description: "Implement routing and navigation"
    prompt: "Set up routing, navigation, and any URL handling needed for the application based on the implemented features."
    timeout: 30

  - name: "Add Styling"
    type: "generate"
    description: "Apply consistent styling and themes"
    prompt: "Add consistent styling, themes, and responsive design to the application. Use modern CSS practices and ensure good UX."
    timeout: 45

  - name: "Generate Tests"
    type: "generate"
    description: "Create test files and test cases"
    prompt: "Generate unit tests, integration tests, and any necessary test setup for the application components and features."
    timeout: 60

  - name: "Create Documentation"
    type: "generate"
    description: "Generate project documentation"
    prompt: "Create comprehensive documentation including README, setup instructions, usage examples, and developer guides."
    timeout: 30

outputs:
  - type: "project"
    directory: "generated-app"
  - type: "documentation"
    filename: "PROJECT-GUIDE.md"
  - type: "setup"
    filename: "SETUP.md"

settings:
  parallel: false
  continueOnError: false
  saveResults: true
  createDirectory: true