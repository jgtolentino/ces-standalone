name: Code Review Workflow
description: Comprehensive code review and improvement suggestions
version: 1.0.0

triggers:
  - command: "review"
  - command: "code review"
  - command: "audit code"

steps:
  - name: "Analyze Structure"
    type: "analyze"
    description: "Analyze code structure and organization"
    prompt: "Analyze the code structure, organization, and architecture. Look for design patterns, modularity, and overall organization."
    timeout: 30

  - name: "Check Best Practices"
    type: "analyze"
    description: "Review code for best practices and patterns"
    prompt: "Review the code for adherence to best practices, coding standards, and common patterns for this language/framework."
    timeout: 30

  - name: "Security Audit"
    type: "analyze"
    description: "Audit code for security vulnerabilities"
    prompt: "Perform a security audit looking for common vulnerabilities, input validation issues, authentication problems, and data exposure risks."
    timeout: 45

  - name: "Performance Review"
    type: "analyze"
    description: "Analyze code for performance optimizations"
    prompt: "Analyze the code for performance bottlenecks, inefficient algorithms, memory usage issues, and optimization opportunities."
    timeout: 30

  - name: "Generate Report"
    type: "generate"
    description: "Generate comprehensive review report"
    prompt: "Generate a comprehensive code review report with findings, recommendations, and priority levels for improvements."
    timeout: 60

outputs:
  - type: "report"
    filename: "code-review-report.md"
  - type: "suggestions"
    filename: "improvement-suggestions.md"

settings:
  parallel: false
  continueOnError: false
  saveResults: true