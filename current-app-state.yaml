# Scout Analytics v3.3 - Current Application State
# Generated from localhost:3000 analysis

version: "3.3.0"
project_name: "Scout Analytics"
environment: "localhost:3000"
generated_at: "2025-01-17"
framework: "Next.js 14"

# Application Architecture
architecture:
  type: "Next.js App Router"
  directory_structure: "app/"
  rendering: "Server Side + Client Components"
  styling: "Tailwind CSS"
  state_management: "React Hooks + SWR"
  
# Current Navigation Structure
navigation:
  layout: "side_navigation"
  position: "left"
  width: "w-64"
  style: "bg-gray-900 text-white"
  brand:
    name: "Scout Analytics"
    version: "v3.3"
    icon: "📊"
  
  menu_items:
    - path: "/"
      label: "Overview"
      icon: "calendar_svg"
      component: "Overview"
      
    - path: "/trends" 
      label: "Trends"
      icon: "trending_up_svg"
      component: "Trends"
      
    - path: "/products"
      label: "Product Mix"
      icon: "cube_svg"
      component: "ProductMix"
      
    - path: "/consumers"
      label: "Consumers"
      icon: "users_svg"
      component: "Consumers"
      
    - path: "/forecast"
      label: "Forecast"
      icon: "bar_chart_svg"
      component: "ForecastPage"
      
    - path: "/ces"
      label: "CES Chat"
      icon: "chat_svg"
      component: "CesChat"

  footer:
    copyright: "© 2025 Scout Analytics"
    powered_by: "Powered by AI"
    badges:
      - label: "Azure WAF"
        icon: "🛡️"
        color: "blue"
      - label: "Responsible AI"
        icon: "🧭"
        color: "green"

# Pages & Components
pages:
  overview:
    path: "/"
    component: "Overview"
    status: "✅ Active"
    features:
      - real_time_kpi_cards
      - automatic_refresh
      - error_handling
    data_source: "/api/kpi/overview"
    kpi_metrics:
      - revenue: "₱{value}"
      - orders: "{count}"
      - aov: "₱{value}"
      - roi: "{value}%"
        
  trends:
    path: "/trends"
    component: "Trends"
    status: "✅ Active"
    features:
      - line_chart_visualization
      - forecast_panel_integration
      - swr_data_fetching
    data_source: "/api/analytics (campaign_performance)"
    
  products:
    path: "/products"
    component: "ProductMix"
    status: "✅ Active"
    features:
      - product_category_breakdown
      - stacked_bar_charts
      - interactive_drill_down
      
  consumers:
    path: "/consumers"
    component: "Consumers"
    status: "✅ Active"
    features:
      - demographic_heatmaps
      - age_distribution_analysis
      - geographic_segmentation
      
  forecast:
    path: "/forecast"
    component: "ForecastPage"
    status: "✅ Active"
    features:
      - predictive_analytics
      - confidence_intervals
      - ai_insights_panel
      - forecastbot_integration
    forecast_options:
      periods: [30, 60, 90]
      confidence_levels: [0.80, 0.85, 0.90, 0.95]
      metrics: ["revenue", "transactions", "aov"]
      
  ces_chat:
    path: "/ces"
    component: "CesChat"
    status: "✅ Active"
    features:
      - ai_chat_interface
      - gpt4o_integration
      - creative_effectiveness_focus
    model: "gpt-4o"
    persona: "BrandBot CES"

# API Routes
api_routes:
  kpi_overview:
    path: "/api/kpi/overview"
    method: "GET"
    status: "✅ Active"
    data_source: "DAL (kpi_revenue_2024)"
    response_format:
      revenue: "number"
      orders: "number"
      aov: "number"
      roi: "number"
      
  analytics:
    path: "/api/analytics"
    method: "POST"
    status: "✅ Active"
    data_source: "DAL (campaign_performance)"
    
  ces_chat:
    path: "/api/ces/chat"
    method: "POST"
    status: "✅ Active"
    provider: "OpenAI"
    model: "gpt-4o"
    
  forecast:
    path: "/api/forecast"
    method: "POST"
    status: "✅ Active"
    features:
      - time_series_prediction
      - confidence_bands
      - growth_rate_calculation
      
  powerbi_dal:
    path: "/api/powerbi/dal"
    method: "POST"
    status: "✅ Active"
    purpose: "Data Access Layer integration"

# AI Features & Assistants
ai_assistants:
  learnbot:
    name: "LearnBot"
    status: "✅ Active"
    position: "bottom-right"
    icon: "🎓"
    color: "blue-gradient"
    features:
      - tutorial_system
      - step_by_step_guidance
      - contextual_help
      - responsible_ai_education
    tutorials:
      - overview_basics
      - trends_advanced
      - product_mix
      - consumers_insights
      - ces_chat
      - responsible_ai_overview
      
  geniebot:
    name: "GenieBot Memory"
    status: "✅ Active"
    position: "bottom-left"
    icon: "🧠"
    color: "purple-gradient"
    features:
      - insight_memory_search
      - contextual_recommendations
      - campaign_insights_rag
      - historical_pattern_analysis
    capabilities:
      - search_campaign_insights
      - get_recommendations_for_context
      - confidence_scoring
      - impact_assessment
      
  ces_ai:
    name: "CES Chat"
    status: "✅ Active"
    model: "gpt-4o"
    persona: "BrandBot CES - Creative Effectiveness Specialist"
    response_style: "Two sentences, focus on creative effectiveness"

# Data Layer (DAL)
data_access_layer:
  status: "✅ Active"
  authentication: "JWT Bearer Token"
  refresh_strategy: "Auto-refresh on 401"
  caching: "no-store"
  
  datasets:
    kpi_revenue_2024:
      query_type: "summary"
      fields: ["total_revenue", "total_transactions", "avg_aov", "avg_roi"]
      
    campaign_performance:
      query_type: "main"
      fields: ["date", "revenue", "transactions"]
      
  environment_variables:
    DAL_HOST: "NEXT_PUBLIC_DAL_HOST"
    DAL_TOKEN: "NEXT_PUBLIC_DAL_TOKEN"
    DAL_KEYKEY_URL: "NEXT_PUBLIC_DAL_KEYKEY_URL"

# Chart & Visualization Components
charts:
  kpi_cards:
    component: "KpiCard"
    style: "clean_white_background"
    layout: "grid_4_columns"
    status: "✅ Active"
    
  line_charts:
    component: "LineChart"
    library: "Chart.js"
    features: ["responsive", "interactive", "tooltips"]
    status: "✅ Active"
    
  forecast_charts:
    component: "ForecastChart"
    library: "Chart.js"
    features: ["confidence_bands", "metric_selection", "time_series"]
    status: "✅ Active"
    
  stacked_bars:
    component: "StackedBar"
    library: "Chart.js"
    status: "✅ Active"
    
  heatmaps:
    component: "Heatmap"
    library: "Chart.js"
    status: "✅ Active"

# State Management
state_management:
  data_fetching: "SWR"
  refresh_intervals:
    kpi_data: "30_seconds"
    campaign_performance: "disabled"
    forecast_data: "on_demand"
  
  error_handling:
    strategy: "graceful_degradation"
    fallback_ui: "error_messages"
    retry_logic: "automatic_refresh"

# UI Framework & Styling
ui_framework:
  css: "Tailwind CSS"
  components: "Custom React Components"
  icons: "SVG inline + Emoji"
  responsive: "Mobile-first design"
  
  color_scheme:
    primary: "blue"
    secondary: "purple"
    background: "gray-50"
    cards: "white"
    navigation: "gray-900"
    
  spacing:
    container: "p-6"
    cards: "rounded-lg shadow"
    grid_gaps: "gap-4"

# Performance & Optimization
performance:
  bundle_optimization: "Next.js automatic"
  image_optimization: "Next.js Image component"
  code_splitting: "App Router automatic"
  caching:
    api_responses: "SWR"
    static_assets: "Next.js default"
    
# Security Features
security:
  authentication: "JWT Bearer tokens"
  cors: "Next.js default"
  environment_variables: "Secure .env handling"
  api_validation: "Input sanitization"
  
  responsible_ai:
    bias_prevention: "Balanced datasets"
    confidence_scoring: "All AI responses"
    human_oversight: "Regular audits"
    data_protection: "Encrypted, no model training"
    transparency: "Clear AI disclosure"

# Dependencies & Packages
dependencies:
  framework:
    next: "^14.2.15"
    react: "^18.3.1"
    typescript: "^5.6.3"
    
  ui_styling:
    tailwindcss: "^3.4.0"
    lucide-react: "^0.263.1"
    
  data_visualization:
    chart.js: "^4.5.0"
    react-chartjs-2: "^5.3.0"
    chartjs-adapter-date-fns: "^3.0.0"
    
  data_fetching:
    swr: "^2.3.3"
    
  ai_integration:
    openai: "Latest (implied)"
    jose: "^6.0.11"
    
  utilities:
    clsx: "^2.1.1"
    js-yaml: "^4.1.0"
    dotenv: "^16.4.5"

# Development & Build
development:
  dev_server: "npm run dev"
  build_command: "npm run build"
  start_command: "npm start"
  linting: "npm run lint"
