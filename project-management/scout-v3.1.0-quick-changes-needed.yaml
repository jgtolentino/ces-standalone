# ============================================================================

immediate_changes:
  
  sidebar_enhancements:
    change_required: "Add collapse functionality + tooltips"
    current_state: "Static sidebar, no collapse"
    target_state: "Collapsible with icon tooltips on hover"
    effort: "2 hours"
    files_to_modify:
      - "app/layout.tsx"
    implementation:
      - "Add state for isCollapsed"
      - "Add toggle button"
      - "Add tooltip component on hover"
      - "Conditional width classes"
    
  multi_metric_charts:
    change_required: "Extend LineChart for multiple datasets"
    current_state: "Single revenue line chart"
    target_state: "Revenue + Transactions + AOV on same chart"
    effort: "1.5 hours"
    files_to_modify:
      - "components/charts/LineChart.tsx"
    implementation:
      - "Accept datasets array instead of single values"
      - "Different colors per metric"
      - "Legend display"
    
  kpi_cards_expansion:
    change_required: "Add 5 missing KPI cards"
    current_state: "4 KPI cards (Revenue, Orders, AOV, ROI)"
    target_state: "9 KPI cards per v3.1.0 spec"
    effort: "1 hour"
    missing_kpis:
      - "Market Share"
      - "Lifetime Value" 
      - "Conversion Rate"
      - "Customer Acquisition Cost"
      - "Active Stores"
    implementation: "Clone existing KpiCard pattern"

