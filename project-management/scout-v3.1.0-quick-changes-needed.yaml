      - "Basic filter bar (2 hours)"
      - "RetailBot page creation (3 hours)"
    result: "Functional v3.1.0 with all required pages"
    
  recommended_minimum:
    duration: "12 hours"
    changes:
      - "All MVP changes (6 hours)"
      - "Multi-metric charts (1.5 hours)"
      - "Streaming responses (3 hours)"
      - "Performance optimization (1.5 hours)"
    result: "Production-quality v3.1.0"

# ============================================================================
# LEVERAGE EXISTING PATTERNS
# ============================================================================

reuse_strategy:
  
  component_cloning:
    - "KpiCard → clone for 5 new KPIs"
    - "CesChat → clone for RetailBot"
    - "LineChart → extend for multi-metric"
    - "Overview layout → template for other pages"
    
  api_pattern_reuse:
    - "/api/ces/chat → template for /api/retailbot/chat"
    - "/api/kpi/overview → extend for new KPIs"
    - "DAL integration → reuse for all new data"
    
  ui_pattern_extension:
    - "Existing chart framework → add new chart types"
    - "SWR caching → apply to new endpoints"
    - "Error handling → extend to new components"

conclusion: |
  With the solid 45% foundation, Scout v3.1.0 compliance can be achieved with
  minimal strategic changes:
  
  - 6 hours: Absolute minimum viable v3.1.0
  - 12 hours: Recommended production-quality version
  - 20 hours: Full-featured with all enhancements
  
  Key strategy: Leverage existing patterns and components rather than 
  building from scratch. Most changes are extensions of working code.