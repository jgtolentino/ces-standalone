api_endpoint_templates:
  authenticated_endpoint:
    name: "Authenticated API Endpoint"
    source_file: "app/api/kpi/overview/route.ts"
    pattern_type: "data_access"
    reusability: "high"
    agent_generator: "manong"
    security_standards:
      - "JWT token validation"
      - "Role-based access control"
      - "Rate limiting"
      - "Input validation"
    template_structure: |
      import { NextRequest, NextResponse } from 'next/server';
      import { validateJWT } from '@/lib/keykey';
      import { getDalConnection } from '@/lib/dal';
      
      export async function GET(request: NextRequest) {
        try {
          // JWT validation
          const user = await validateJWT(request);
          if (!user) {
            return NextResponse.json({ error: 'Unauthorized' }, { status: 401 });
          }
          
          // DAL integration
          const data = await getDalConnection().query(/* query */);
          
          // Response formatting
          return NextResponse.json(data);
        } catch (error) {
          return NextResponse.json({ error: 'Internal Server Error' }, { status: 500 });
        }
      }
    dependencies:
      - "jsonwebtoken"
      - "next"
      - "@/lib/dal"
      - "@/lib/keykey"
    skr_context_required:
      - "responsible-ai-compliance.yaml"
      - "scout.yaml#data_architecture"
    
  streaming_endpoint:
    name: "Streaming API Endpoint"
    source_file: "app/api/ces/chat/route.ts"
    pattern_type: "ai_integration"
    reusability: "medium"
    agent_generator: "manong"
    ai_standards:
      - "Azure OpenAI integration"
      - "Streaming responses"
      - "Context injection"
      - "Error handling"
    template_structure: |
      import { NextRequest } from 'next/server';
      import { OpenAIStream, StreamingTextResponse } from 'ai';
      import { openai } from '@/lib/azure-openai';
      
      export async function POST(request: NextRequest) {
        try {
          const { messages } = await request.json();
          
          // SKR context injection
          const contextualMessages = await injectSKRContext(messages);
          
          // Azure OpenAI streaming
          const response = await openai.chat.completions.create({
            model: 'gpt-4',
            messages: contextualMessages,
            stream: true,
          });
          
          const stream = OpenAIStream(response);
          return new StreamingTextResponse(stream);
        } catch (error) {
          return new Response('Error', { status: 500 });
        }
      }
    dependencies:
      - "ai"
      - "openai"
      - "next"
    skr_context_required:
      - "ces.yaml#framework"
      - "responsible-ai-compliance.yaml"

test_pattern_templates:
  component_test:
    name: "Component Test Pattern"
    pattern_type: "unit_testing"
    reusability: "high"
    agent_generator: "caca"
    testing_standards:
      - "90% code coverage minimum"
      - "Accessibility testing"
      - "Visual regression testing"
      - "Performance testing"
    template_structure: |
      import { render, screen, fireEvent } from '@testing-library/react';
      import { axe, toHaveNoViolations } from 'jest-axe';
      import Component from '@/components/Component';
      
      expect.extend(toHaveNoViolations);
      
      describe('Component', () => {
        it('renders correctly', () => {
          render(<Component />);
          expect(screen.getByRole('main')).toBeInTheDocument();
        });
        
        it('has no accessibility violations', async () => {
          const { container } = render(<Component />);
          const results = await axe(container);
          expect(results).toHaveNoViolations();
        });
        
        it('handles user interactions', () => {
          render(<Component />);
          fireEvent.click(screen.getByRole('button'));
          // Assertions
        });
      });
    dependencies:
      - "@testing-library/react"
      - "@testing-library/jest-dom"
      - "jest-axe"
      - "jest"
    
  api_test:
    name: "API Endpoint Test Pattern"
    pattern_type: "integration_testing"
    reusability: "high"
    agent_generator: "caca"
    testing_standards:
      - "Authentication testing"
      - "Error handling validation"
      - "Performance benchmarking"
      - "Security testing"
    template_structure: |
      import { NextRequest } from 'next/server';
      import { GET, POST } from '@/app/api/endpoint/route';
      
      describe('/api/endpoint', () => {
        it('requires authentication', async () => {
          const request = new NextRequest('http://localhost/api/endpoint');
          const response = await GET(request);
          expect(response.status).toBe(401);
        });
        
        it('returns data for authenticated users', async () => {
          const request = new NextRequest('http://localhost/api/endpoint', {
            headers: { Authorization: 'Bearer valid-token' }
          });
          const response = await GET(request);
          expect(response.status).toBe(200);
        });
        
        it('handles errors gracefully', async () => {
          // Error scenario testing
        });
      });
    dependencies:
      - "next"
      - "jest"
      - "@testing-library/jest-dom"

