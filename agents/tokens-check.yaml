# 🎨 Design Tokens Validation Schema
# Visual Artist Excellence Standard - Token Validation

name: "design_tokens_validation"
version: "2.0"
description: "Validation schema for design tokens export and quality"
schema_type: "design_tokens_validator"

validation_rules:
  structure:
    required_categories:
      - "colors"
      - "typography"
      - "spacing"
      - "breakpoints"
      - "shadows"
      - "borders"
      - "animations"
    
    optional_categories:
      - "icons"
      - "illustrations"
      - "gradients"
      - "patterns"

  colors:
    required_tokens:
      - name: "primary"
        type: "color"
        format: ["hex", "rgb", "hsl"]
        accessibility: "wcag_aa_compliant"
      - name: "secondary"
        type: "color"
        format: ["hex", "rgb", "hsl"]
        accessibility: "wcag_aa_compliant"
      - name: "background"
        type: "color"
        format: ["hex", "rgb", "hsl"]
        accessibility: "wcag_aa_compliant"
      - name: "surface"
        type: "color"
        format: ["hex", "rgb", "hsl"]
        accessibility: "wcag_aa_compliant"
      - name: "text-primary"
        type: "color"
        format: ["hex", "rgb", "hsl"]
        accessibility: "wcag_aa_compliant"
      - name: "text-secondary"
        type: "color"
        format: ["hex", "rgb", "hsl"]
        accessibility: "wcag_aa_compliant"
      - name: "error"
        type: "color"
        format: ["hex", "rgb", "hsl"]
        accessibility: "wcag_aa_compliant"
      - name: "warning"
        type: "color"
        format: ["hex", "rgb", "hsl"]
        accessibility: "wcag_aa_compliant"
      - name: "success"
        type: "color"
        format: ["hex", "rgb", "hsl"]
        accessibility: "wcag_aa_compliant"
    
    validation_criteria:
      - criterion: "contrast_ratio"
        description: "Text colors must have 4.5:1 contrast ratio with backgrounds"
        test_method: "automated_contrast_check"
        threshold: "4.5"
      - criterion: "color_blindness"
        description: "Colors must be distinguishable for color blind users"
        test_method: "color_blindness_simulation"
        variants: ["protanopia", "deuteranopia", "tritanopia"]
      - criterion: "brand_consistency"
        description: "Colors must align with brand guidelines"
        test_method: "brand_palette_comparison"
        tolerance: "5%_variance"

  typography:
    required_tokens:
      - name: "font-family-primary"
        type: "fontFamily"
        format: "font_stack"
        fallbacks: "required"
      - name: "font-family-secondary"
        type: "fontFamily"
        format: "font_stack"
        fallbacks: "required"
      - name: "font-size-xs"
        type: "fontSize"
        format: ["rem", "px"]
        responsive: "required"
      - name: "font-size-sm"
        type: "fontSize"
        format: ["rem", "px"]
        responsive: "required"
      - name: "font-size-base"
        type: "fontSize"
        format: ["rem", "px"]
        responsive: "required"
      - name: "font-size-lg"
        type: "fontSize"
        format: ["rem", "px"]
        responsive: "required"
      - name: "font-size-xl"
        type: "fontSize"
        format: ["rem", "px"]
        responsive: "required"
      - name: "font-weight-normal"
        type: "fontWeight"
        format: "numeric"
        range: [100, 900]
      - name: "font-weight-medium"
        type: "fontWeight"
        format: "numeric"
        range: [100, 900]
      - name: "font-weight-bold"
        type: "fontWeight"
        format: "numeric"
        range: [100, 900]
      - name: "line-height-tight"
        type: "lineHeight"
        format: "unitless"
        range: [1.0, 2.0]
      - name: "line-height-normal"
        type: "lineHeight"
        format: "unitless"
        range: [1.0, 2.0]
      - name: "line-height-loose"
        type: "lineHeight"
        format: "unitless"
        range: [1.0, 2.0]
    
    validation_criteria:
      - criterion: "readability"
        description: "Typography must meet readability standards"
        test_method: "readability_analysis"
        metrics: ["flesch_reading_ease", "line_length", "character_spacing"]
      - criterion: "accessibility"
        description: "Typography must be accessible to all users"
        test_method: "accessibility_audit"
        standards: ["wcag_2_1_aa"]
      - criterion: "responsive_scaling"
        description: "Typography must scale appropriately across breakpoints"
        test_method: "responsive_testing"
        breakpoints: ["320px", "768px", "1024px", "1440px", "2560px"]

  spacing:
    required_tokens:
      - name: "space-xs"
        type: "spacing"
        format: ["rem", "px"]
        scale: "consistent"
      - name: "space-sm"
        type: "spacing"
        format: ["rem", "px"]
        scale: "consistent"
      - name: "space-md"
        type: "spacing"
        format: ["rem", "px"]
        scale: "consistent"
      - name: "space-lg"
        type: "spacing"
        format: ["rem", "px"]
        scale: "consistent"
      - name: "space-xl"
        type: "spacing"
        format: ["rem", "px"]
        scale: "consistent"
    
    validation_criteria:
      - criterion: "mathematical_scale"
        description: "Spacing must follow consistent mathematical progression"
        test_method: "scale_validation"
        acceptable_ratios: ["1.25", "1.333", "1.414", "1.5", "1.618"]
      - criterion: "visual_rhythm"
        description: "Spacing must create consistent visual rhythm"
        test_method: "visual_rhythm_analysis"
        baseline_grid: "8px"

  breakpoints:
    required_tokens:
      - name: "breakpoint-xs"
        type: "dimension"
        format: "px"
        value: "320px"
      - name: "breakpoint-sm"
        type: "dimension"
        format: "px"
        value: "768px"
      - name: "breakpoint-md"
        type: "dimension"
        format: "px"
        value: "1024px"
      - name: "breakpoint-lg"
        type: "dimension"
        format: "px"
        value: "1440px"
      - name: "breakpoint-xl"
        type: "dimension"
        format: "px"
        value: "2560px"
    
    validation_criteria:
      - criterion: "device_coverage"
        description: "Breakpoints must cover all target devices"
        test_method: "device_testing"
        devices: ["mobile", "tablet", "desktop", "large_desktop"]
      - criterion: "content_optimization"
        description: "Content must be optimized at each breakpoint"
        test_method: "content_analysis"
        metrics: ["readability", "usability", "visual_hierarchy"]

  shadows:
    required_tokens:
      - name: "shadow-sm"
        type: "boxShadow"
        format: "css_shadow"
        layers: "single_or_multiple"
      - name: "shadow-md"
        type: "boxShadow"
        format: "css_shadow"
        layers: "single_or_multiple"
      - name: "shadow-lg"
        type: "boxShadow"
        format: "css_shadow"
        layers: "single_or_multiple"
    
    validation_criteria:
      - criterion: "elevation_hierarchy"
        description: "Shadows must create clear elevation hierarchy"
        test_method: "visual_hierarchy_analysis"
        levels: "minimum_3_distinct"
      - criterion: "performance_impact"
        description: "Shadows must not negatively impact performance"
        test_method: "performance_testing"
        threshold: "60fps_maintained"

  borders:
    required_tokens:
      - name: "border-width-thin"
        type: "borderWidth"
        format: "px"
        range: [1, 3]
      - name: "border-width-medium"
        type: "borderWidth"
        format: "px"
        range: [1, 5]
      - name: "border-width-thick"
        type: "borderWidth"
        format: "px"
        range: [2, 8]
      - name: "border-radius-sm"
        type: "borderRadius"
        format: ["px", "rem"]
        consistency: "required"
      - name: "border-radius-md"
        type: "borderRadius"
        format: ["px", "rem"]
        consistency: "required"
      - name: "border-radius-lg"
        type: "borderRadius"
        format: ["px", "rem"]
        consistency: "required"

  animations:
    required_tokens:
      - name: "duration-fast"
        type: "duration"
        format: "ms"
        range: [100, 300]
      - name: "duration-normal"
        type: "duration"
        format: "ms"
        range: [200, 500]
      - name: "duration-slow"
        type: "duration"
        format: "ms"
        range: [400, 800]
      - name: "easing-ease-in"
        type: "cubicBezier"
        format: "css_timing_function"
        performance: "optimized"
      - name: "easing-ease-out"
        type: "cubicBezier"
        format: "css_timing_function"
        performance: "optimized"
      - name: "easing-ease-in-out"
        type: "cubicBezier"
        format: "css_timing_function"
        performance: "optimized"
    
    validation_criteria:
      - criterion: "performance_60fps"
        description: "Animations must maintain 60fps performance"
        test_method: "performance_profiling"
        threshold: "60fps_minimum"
      - criterion: "accessibility_compliance"
        description: "Animations must respect user preferences"
        test_method: "accessibility_testing"
        considerations: ["prefers_reduced_motion", "vestibular_disorders"]

export_formats:
  required:
    - format: "json"
      structure: "nested_object"
      naming_convention: "kebab-case"
    - format: "css_custom_properties"
      structure: "flat_variables"
      naming_convention: "kebab-case"
      prefix: "--"
    - format: "scss_variables"
      structure: "flat_variables"
      naming_convention: "kebab-case"
      prefix: "$"
  
  optional:
    - format: "javascript_object"
      structure: "nested_object"
      naming_convention: "camelCase"
    - format: "typescript_definitions"
      structure: "type_definitions"
      naming_convention: "camelCase"

validation_automation:
  tools:
    - name: "design_tokens_validator"
      purpose: "schema_validation"
      integration: "ci_cd_pipeline"
    - name: "contrast_checker"
      purpose: "accessibility_validation"
      integration: "automated_testing"
    - name: "visual_regression_tester"
      purpose: "consistency_validation"
      integration: "deployment_pipeline"
  
  triggers:
    - event: "tokens_export"
      action: "run_validation_suite"
    - event: "design_update"
      action: "validate_token_consistency"
    - event: "deployment"
      action: "verify_token_implementation"

quality_gates:
  passing_criteria:
    - "all_required_tokens_present: 100%"
    - "accessibility_compliance: wcag_aa"
    - "performance_impact: minimal"
    - "brand_consistency: validated"
    - "cross_browser_compatibility: 100%"
  
  excellence_criteria:
    - "mathematical_scale_consistency: perfect"
    - "visual_hierarchy_clarity: excellent"
    - "animation_performance: 60fps_maintained"
    - "responsive_optimization: all_breakpoints"

reporting:
  validation_report:
    - "token_completeness_score"
    - "accessibility_compliance_status"
    - "performance_impact_analysis"
    - "brand_consistency_validation"
    - "implementation_recommendations"
  
  dashboard_metrics:
    - "token_adoption_rate"
    - "consistency_violations"
    - "performance_metrics"
    - "accessibility_score"

integration:
  figma:
    - plugin: "design_tokens_sync"
    - validation: "real_time_feedback"
    - export: "automated_on_update"
  
  development:
    - build_process: "token_validation_step"
    - linting: "token_usage_enforcement"
    - testing: "visual_regression_detection"
  
  deployment:
    - verification: "token_implementation_check"
    - monitoring: "runtime_consistency_validation"
    - rollback: "token_mismatch_detection"
